name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission
        run: chmod +x ./gradlew 2>/dev/null || echo "no gradlew yet"

      - name: Build Debug APK
        run: |
          # Try gradle wrapper first
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            # Fallback: use system gradle
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: List build outputs (debug)
        if: failure()
        run: |
          find . -name "*.apk" 2>/dev/null
          find . -path "*/build/*" -name "*.log" 2>/dev/null | head -5
          cat app/build/outputs/logs/* 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JFToolbox-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
